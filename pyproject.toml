[project]
name = "travel-agent"
version = "0.1.0"
description = "WhatsApp travel agent powered by LangChain"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "streamlit (>=1.60.0,<2.0.0)",
]
